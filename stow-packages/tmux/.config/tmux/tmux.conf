# --- Mouse ---
# Click to focus panes and switch windows, drag pane borders to resize, and
# scroll the wheel (enters copy mode in a pane).
set -g mouse on

# Send tmux copy-mode selections to the system clipboard via OSC 52, so text
# selected with the mouse can be copied to the macOS clipboard.
set -g set-clipboard on

# --- Extended keys ---
# tmux strips key modifiers by default, so Shift+Enter arrives as plain Enter
# and OpenCode submits instead of inserting a newline. Forward extended keys in
# CSI-u (Kitty) format so OpenCode receives Shift+Enter distinctly.
# Requires tmux 3.5+.
set -s extended-keys on
set -s extended-keys-format csi-u

# Pass OSC 8 hyperlinks through to Ghostty so they're clickable (cmd+click).
set -as terminal-features ',xterm-ghostty:hyperlinks'

# --- Windows ---
set -g base-index 1              # Window numbers start at 1
set -g renumber-windows on       # No gaps after closing windows

# --- Copy mode ---
setw -g mode-keys vi             # Vi bindings in copy mode

# --- Keys ---
set -s escape-time 0             # No delay after Esc
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix h/j/k/l; overrides default prefix l = last-window)
# and repeatable resize (prefix H/J/K/L).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode: v starts a selection, y copies and exits. Tab leaves copy
# mode, matching Tab-as-Esc in nvim.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Tab send -X cancel

# --- Misc ---
set -g focus-events on           # Pass terminal focus in/out to apps (nvim autoread)
set -g history-limit 50000       # Scrollback lines per pane (default 2000)
