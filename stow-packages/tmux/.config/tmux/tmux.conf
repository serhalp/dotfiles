# --- Mouse ---
# Click to focus panes and switch windows, drag pane borders to resize, and
# scroll the wheel (enters copy mode in a pane).
set -g mouse on

# Send tmux copy-mode selections to the system clipboard via OSC 52, so text
# selected with the mouse can be copied to the macOS clipboard.
set -g set-clipboard on

# --- Extended keys ---
# tmux strips key modifiers by default, so Shift+Enter arrives as plain Enter
# and OpenCode submits instead of inserting a newline. Forward extended keys in
# CSI-u (Kitty) format so OpenCode receives Shift+Enter distinctly.
# Requires tmux 3.5+.
set -s extended-keys on
set -s extended-keys-format csi-u

# --- Windows ---
set -g base-index 1              # Window numbers start at 1
set -g renumber-windows on       # No gaps after closing windows

# --- Copy mode ---
setw -g mode-keys vi             # Vi bindings in copy mode

# --- Keys ---
set -s escape-time 0             # No delay after Esc
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
